name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org' # Match your docmd config
          cache: 'npm'

      - name: Upgrade NPM to latest (Safe for Node 22)
        # Using corepack because 'npm install -g npm@latest' has a dependency bug on Node 22 runners
        run: |
          corepack enable
          corepack prepare npm@latest --activate

      - name: Verify Environment
        # Robust safety check as seen in your docmd workflow
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build and Verify
        # Ensures package is correct before we try to push it
        run: |
          npm run build --if-present
          npm test --if-present

      - name: Publish to NPM
        # Uses Trusted Publishing (OIDC). No secrets/tokens required in the code.
        # Ensure you have added this repo as a Trusted Publisher on npmjs.com
        run: npm publish --access public --provenance